[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero2route3d-sdk"
version = "0.12.0"
authors = [
    { name = "Yusuf Eminoğlu", email = "yusufeminoglu@gmail.com" }
]
description = "Headless 3D mobility, Tunnel Smoke Dispersion & Hyperloop Tube Aerodynamics Suite."
keywords = [
    "gis",
    "routing",
    "shortest-path",
    "isochrone",
    "accessibility",
    "walkability",
    "mobility",
    "kinematics",
    "openstreetmap",
    "dem",
    "pareto",
    "map-matching",
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
geo = [
    "shapely>=2.0.0",
    "rasterio>=1.3.0",
    "geopandas>=0.12.0",
    "networkx>=2.8.0",
    "matplotlib>=3.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
zero2route3d = "zero2route3d.cli:main"

[project.urls]
Homepage = "https://github.com/YusufEminoglu/zero2route3d_sdk"
Repository = "https://github.com/YusufEminoglu/zero2route3d_sdk"
Issues = "https://github.com/YusufEminoglu/zero2route3d_sdk/issues"
Documentation = "https://yusufeminoglu.github.io/zero2route3d_sdk/"
Changelog = "https://github.com/YusufEminoglu/zero2route3d_sdk/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zero2route3d = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    "scratch",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
files = ["src"]

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "sklearn.*",
    "shapely.*",
    "rasterio.*",
    "geopandas.*",
    "networkx.*",
    "matplotlib.*",
    # QGIS and GDAL are optional, host-provided runtimes: every import of them in
    # this package is lazy and guarded, and they are never installed in CI.
    "qgis.*",
    "osgeo.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets `pytest` run straight from a clone, without an editable install first.
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["zero2route3d"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 50
