# GitLab CI/CD Pipeline for PyPI Python SDK
# Author: Yusuf Eminoğlu

stages:
  - test
  - build
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/

test:
  stage: test
  image: python:3.11-slim
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]" || python -m pip install -e . pytest ruff
  script:
    - python -m ruff check . || true
    - python -m pytest tests/ || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build:
  stage: build
  image: python:3.11-slim
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install build twine
  script:
    - python -m build
    - python -m twine check --strict dist/*
  artifacts:
    name: "dist-$CI_COMMIT_REF_SLUG"
    paths:
      - dist/
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

publish_pypi:
  stage: publish
  image: python:3.11-slim
  needs: ["build"]
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install twine
  script:
    - python -m twine upload --non-interactive dist/*
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $TRIGGER_PYPI_PUBLISH == "true"
      when: manual
  allow_failure: false
